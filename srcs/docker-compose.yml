services:

  # MDB stores database used by WP and communicates with the other containers through the private network. 
  # Its DB files are persisted in wp_database_store, so they survive container recreation. 
  # MDB_PORT is exposed only inside the Docker network and is not published to the host. 
  # MDB healthcheck executes a simple SQL query to confirm that MDB is actually ready to accept connections, 
  # allowing WP wait for a healthy DB instead of only waiting for the container to be started.
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    restart: on-failure
    env_file:
      - .env
    volumes:
      - wp_database_store:/var/lib/mysql
    networks:
      - inception_bridge
    expose:
      - "${MDB_PORT}"
    secrets:
      - db_root_password
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h localhost -u rmedeiro -p$$(cat /run/secrets/db_password) -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 1s
      timeout: 2s
      retries: 30

  # WP runs website through php-fpm and communicates with MDB and redis through private network. 
  # Its website files are persisted in wp_content_store and shared with nginx and FTP. 
  # PHP_FPM_PORT is exposed only inside the docker network so nginx can forward PHP requests to it.
  # WP's healthcheck verifies that pid 1 is php-fpm, preventing nginx from starting while WP is still
  # downloading, installing or configuring the website before php-fpm runs.
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    container_name: wordpress
    restart: on-failure
    env_file:
      - .env
    volumes:
      - wp_content_store:/var/www/html
    networks:
      - inception_bridge
    expose:
      - "${PHP_FPM_PORT}"
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grep", "-q", "php-fpm", "/proc/1/cmdline"]
      interval: 1s
      timeout: 2s
      retries: 30

  # NGINX is the only https entry point for the websites and web interfaces.
  # Port 443 is published to the host because external clients must be able to reach it. 
  # It shares wp_content_store with WordPress to serve website files and uses docker network to communicate 
  # with internal services such as WP, adminer, static and portainer. 
  # NGINX waits for the WP healthcheck so php-fpm is running before NGINX starts accepting php requests.
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    restart: on-failure
    ports:
      - "443:443"
    volumes:
      - wp_content_store:/var/www/html
    networks:
      - inception_bridge
    env_file:
      - .env
    depends_on:
      wordpress:
        condition: service_healthy

  # redis provides a memory object cache used by WP to reduce repeated DB operations. 
  # It is connected only to docker network because it only needs to communicate with WP. 
  # No persistent volume is required here, redis data is used as temporary cache, and WP only requires the redis to 
  # be started before WP starts.
  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis
    container_name: redis
    restart: on-failure
    env_file:
      - .env
    networks:
      - inception_bridge
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  # adminer provides a web interface for managing the MDB database. 
  # It uses docker network to connect to MDB and to receive proxied requests from NGINX. 
  # Port 8080 is exposed only inside the docker network because users reach adminer through NGINX instead of 
  # connecting directly to the container. It does not need a volume because database persistence is handled by MDB itself.
  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer
    container_name: adminer
    restart: on-failure
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - inception_bridge
    depends_on:
      - mariadb
  
  # ftp provides remote file access to the WP website. It shares wp_content_store with WP and NGINX, so 
  # transferred files through ftp refer to same files used by wp and nginx and affect the same persistent website files. 
  # It uses port 21 and the 40000-40010 passive range are published to the host because an external ftp client must 
  # connect to them.
  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    image: ftp
    container_name: ftp
    restart: on-failure
    env_file:
      - .env
    secrets:
      - ftp_password
    volumes:
      - wp_content_store:/var/www/html
    networks:
      - inception_bridge
    ports:
      - "21:21"
      - "40000-40010:40000-40010"
    depends_on:
      - wordpress

  # static hosts the static website independently from WP. It is connected to docker network so NGINX can reach it 
  # by its service name. Port 443 is exposed internally because external requests reach the static website through 
  # NGINX reverse proxy, so NGINX can proxy requests to static without publishing another web port directly on the host.
  # It does not require persistent storage because its static files are included in its image.
  static:
    build:
      context: ./requirements/bonus/static
      dockerfile: Dockerfile
    image: static
    container_name: static
    restart: on-failure
    env_file:
      - .env
    expose:
      - "8081"
    networks:
      - inception_bridge

  # portainer provides a web interface for monitoring and managing Docker. It accesses the Docker daemon through 
  # /var/run/docker.sock and stores its own configuration persistently in portainer_store. 
  # It uses docker network so NGINX can proxy requests to it, while port 9000 is exposed only internally instead of 
  # being published directly to the host.
  portainer:
    build:
      context: ./requirements/bonus/portainer
      dockerfile: Dockerfile
    image: portainer
    container_name: portainer
    restart: on-failure
    env_file:
      - .env
    volumes:
      - portainer_store:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - inception_bridge
    expose:
      - "9000"

volumes:

  wp_database_store:
    name: wp_database_store
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb

  wp_content_store:
    name: wp_content_store
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress

  portainer_store:
    name: portainer_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/portainer

# the private bridge network allows containers to communicate using their service names while 
# keeping internal services isolated from direct access by the host.
networks:

  inception_bridge:
    driver: bridge

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
