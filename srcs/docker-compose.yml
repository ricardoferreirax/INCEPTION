services:

  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    expose:
      - "${MDB_PORT}"
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password
    restart: always

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    container_name: wordpress
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    expose:
      - "${PHP_FPM_PORT}"
    env_file:
      - .env
    environment:
      BONUS_MODE: ${BONUS_MODE:-0}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      - mariadb
    restart: always

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
    env_file:
      - .env
    environment:
      BONUS_MODE: ${BONUS_MODE:-0}
    depends_on:
      - wordpress
    restart: always

  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis
    container_name: redis
    networks:
      - inception
    restart: always

  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer
    container_name: adminer
    networks:
      - inception
    expose:
      - "8080"
    depends_on:
      - mariadb
    restart: always

  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    image: ftp
    container_name: ftp
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    ports:
      - "21:21"
      - "40000-40010:40000-40010"
    env_file:
      - .env
    secrets:
      - ftp_password
    depends_on:
      - wordpress
    restart: always

  static:
    build:
      context: ./requirements/bonus/static
      dockerfile: Dockerfile
    image: static
    container_name: static
    networks:
      - inception
    expose:
      - "443"
    restart: always

networks:
  inception:
    driver: bridge

volumes:
  mariadb:
    name: mariadb
    driver: local
  wordpress:
    name: wordpress
    driver: local

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
